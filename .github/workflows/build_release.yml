name: Build ArkNovel (Android & Windows)

on:
  workflow_dispatch:

jobs:
  # 1. Android 端（含重试机制、Cronet 独立网络栈、代码混淆与双架构分包）
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
      - name: Restore fixed debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
      - name: Build Split APKs (with 504 retry)
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define=cronetHttpNoPlay=true --obfuscate --split-debug-info=build/symbols -t lib/next/main.dart && exit 0
            [ "$attempt" = 3 ] || sleep 60
          done
          exit 1

      - name: Rename APKs with Version
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

      - name: Upload Android arm64-v8a (64位)
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a
          path: build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk

      - name: Upload Android armeabi-v7a (32位)
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

  # 2. Windows 端（必须锁定 windows-2022 以避开 VS 2026 的 STL1011 编译错误）
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release -t lib/next/main.dart

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Windows-x64
          path: build/windows/x64/runner/Release/
