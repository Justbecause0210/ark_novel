name: Build ArkNovel (Android & Windows)

on:
  workflow_dispatch:

jobs:
  # 1. Android 端（强制绑定固定签名、apksigner 指纹校验、重试机制与双架构分包）
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Fixed Android Signing
        run: |
          if [ -z "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 为空！"
            exit 1
          fi
          # 同时还原到默认路径、android/ 和 android/app/ 目录下，确保任何相对路径都能找到
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
          cp ~/.android/debug.keystore android/release.keystore
          cp ~/.android/debug.keystore android/app/release.keystore

          # 生成标准 key.properties
          cat << 'EOF' > android/key.properties
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=release.keystore
          EOF

          echo "=== Keystore SHA-256 指纹 ==="
          keytool -list -keystore android/release.keystore -storepass android | grep "SHA-256"

      - name: Build Split APKs (with 504 retry)
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --split-per-abi --dart-define=cronetHttpNoPlay=true --obfuscate --split-debug-info=build/symbols -t lib/next/main.dart && exit 0
            [ "$attempt" = 3 ] || sleep 60
          done
          exit 1

      - name: Verify APK Signature with apksigner
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -n 1)
          echo "=== 使用 $APKSIGNER 校验最终 APK 签名 ==="
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | grep "SHA-256"

      - name: Rename APKs with Version
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

      - name: Upload Android arm64-v8a (64位)
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a
          path: build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-arm64-v8a.apk

      - name: Upload Android armeabi-v7a (32位)
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a
          path: build/app/outputs/flutter-apk/ArkNovel-${{ steps.version.outputs.app_version }}-Android-armeabi-v7a.apk

  # 2. Windows 端（必须锁定 windows-2022 以避开 VS 2026 的 STL1011 编译错误）
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract App Version
        id: version
        shell: bash
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          SAFE_VER=$(echo "$RAW_VER" | tr '+' '-')
          echo "app_version=$SAFE_VER" >> $GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release -t lib/next/main.dart

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v6
        with:
          name: ArkNovel-${{ steps.version.outputs.app_version }}-Windows-x64
          path: build/windows/x64/runner/Release/
